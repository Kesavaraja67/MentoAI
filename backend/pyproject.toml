[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "mentoai-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.1",
    "uvicorn[standard]==0.30.1",
    "falkordb==1.8.0",
    "httpx==0.27.0",
    "pydantic==2.7.4",
    "pydantic-settings==2.3.4",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "httpx==0.27.0",
]
